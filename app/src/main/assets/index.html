display:flex;align-items:end;gap:8px;height:152px;margin:16px 0 6px}.barcol{flex:1;text-align:center;min-width:0}.barcol .bar{background:linear-gradient(#9b9fff,#626ccb);border-radius:7px 7px 3px 3px;min-height:3px}.barcol span{font-size:10px;color:var(--muted);margin-top:8px;display:block}.barcol b{display:block;font-size:10px;margin:0 0 5px;color:var(--muted)}.settingrow{padding:12px 0;border-bottom:1px solid var(--line)}.settingrow:last-child{border-bottom:0}.settingrow h3{font-size:14px;margin:0 0 5px}.filebtn{display:inline-block;cursor:pointer}.filebtn input{display:none}.toast{position:fixed;z-index:9;left:50%;bottom:94px;transform:translateX(-50%);background:#d7fce9;color:#123225;box-shadow:0 12px 40px #0007;padding:13px 19px;border-radius:13px;font-weight:700;font-size:13px;max-width:90%;text-align:center}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0e1728eF;backdrop-filter:blur(15px);border-top:1px solid #344158;display:flex;justify-content:center;gap:5px;padding:9px max(12px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom));z-index:4}.bottom button{border:0;background:transparent;color:var(--muted);padding:7px 10px;border-radius:13px;font-size:11px;min-width:65px}.bottom button span{display:block;font-size:22px;margin-bottom:4px}.bottom button.on{color:#b8bdff;background:#282d51}.bottom button.add{background:#8e96ff;color:#111834;font-weight:850}.help{border-left:3px solid var(--accent);background:#8e96ff14;padding:11px 14px;border-radius:8px;font-size:13px;line-height:1.5;color:#cdd5ef}.right{text-align:right}@media(max-width:700px){.wrap{padding:15px 12px 108px}.grid,.herogrid{grid-template-columns:1fr}.hero{padding:20px}.motivation{display:none}.card{padding:17px}.formgrid{grid-template-columns:1fr 1fr}.bottom{justify-content:space-around}.bottom button{min-width:55px;padding:7px 4px}.top .pill{font-size:11px}.balance{font-size:39px}}@media(max-width:380px){.formgrid{grid-template-columns:1fr}.summary{gap:12px}.summary b .modebox{border:1px solid #455a83;border-radius:19px;padding:17px;background:linear-gradient(130deg,#1c2d4a,#17243a);margin:0 0 18px}.modebox h2{font-size:15px;margin:0 0 10px}.modegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.modegrid button{padding:11px 8px;border-radius:12px;border:1px solid #455571;background:#142037;color:#cdd8e9;font-weight:750}.modegrid button.on{border-color:var(--green);background:#16483e;color:#e5fff5}.daterange{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:12px}.daterange label{flex:1;min-width:135px}.periodinfo{color:#bad0e5;font-size:12px;line-height:1.6;margin:10px 0 0}.welcome{position:fixed;inset:0;z-index:30;background:#080e19ee;display:grid;place-items:center;padding:16px;overflow:auto}.welcomepanel{width:min(540px,100%);background:#18253d;border:1px solid #53617d;border-radius:25px;padding:25px;box-shadow:0 25px 80px #000b}.welcomechoices{display:grid;gap:10px;margin:20px 0}.welcomechoices button{text-align:left;padding:17px;background:#20324f;color:#fff;border:1px solid #536381;border-radius:14px}.welcomechoices button.on{border:2px solid var(--green);background:#174438}.welcomechoices button b{display:block;margin-bottom:6px}.welcomechoices button span{display:block;color:#b6c9d9;font-size:13px;line-height:1.5}.minihelp{font-size:12px;color:#bfd1e4;line-height:1.6} @media(max-width:420px){.modegrid{grid-template-columns:1fr 1fr 1fr}.modegrid button{font-size:12px}.welcomepanel{padding:18px}}

<script>
'use strict';
const KEY='mibolsillo_v2';
const categories={personal:{gasto:['Alimentación','Transporte','Compras','Servicios','Salud','Educación','Entretenimiento','Ahorro','Otros'],ingreso:['Sueldo','Trabajo extra','Regalos','Ventas','Otros']},negocio:{gasto:['Mercadería','Gasolina','Transporte','Alquiler','Servicios','Sueldos','Publicidad','Ahorro','Otros'],ingreso:['Ventas','Cobros','Capital','Otros']}};
const icons={'Alimentación':'🍔','Transporte':'🚌','Compras':'🛍️','Servicios':'💡','Salud':'💊','Educación':'📚','Entretenimiento':'🎮','Ahorro':'🐷','Otros':'🧾','Mercadería':'📦','Gasolina':'⛽','Alquiler':'🏠','Sueldos':'👥','Publicidad':'📣','Ventas':'🛒','Cobros':'💵','Sueldo':'💼','Trabajo extra':'💻','Regalos':'🎁','Capital':'🏦'};
const blank=()=>({currency:{personal:'BOB',negocio:'BOB'},quickNotification:false,transactions:[],budgets:{personal:1500,negocio:5000},goals:{personal:{name:'Mi fondo de emergencia',target:3000},negocio:{name:'Capital para crecer',target:10000}},account:'personal',theme:'dark',displayMode:null});
let db;try{const raw=JSON.parse(localStorage.getItem(KEY));db=raw&&Array.isArray(raw.transactions)&&raw.budgets&&raw.goals?raw:blank()}catch(e){db=blank()}
db.currency=db.currency||{personal:'BOB',negocio:'BOB'};db.quickNotification=!!db.quickNotification;
let tab='inicio',entryType='gasto',editing=null,filterType='todos',search='',toastTimer=null,voice=null;
let displayMode=['dia','mes','rango'].includes(db.displayMode)?db.displayMode:null, customFrom=localDaySafe(),customTo=localDaySafe(),showEntireHistory=false;
function localDaySafe(){const d=new Date(),o=new Date(d.getTime()-d.getTimezoneOffset()*60000);return o.toISOString().slice(0,10)}
const CURRENCIES={BOB:{s:'Bs',n:'Boliviano'},USD:{s:'US$',n:'Dólar estadounidense'},EUR:{s:'€',n:'Euro'},BRL:{s:'R$',n:'Real brasileño'},ARS:{s:'AR$',n:'Peso argentino'}};
const $=id=>document.getElementById(id),money=n=>(CURRENCIES[db.currency?.[db.account]]||CURRENCIES.BOB).s+' '+Number(n||0).toLocaleString('es-BO',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDay=(d=new Date())=>{const o=new Date(d.getTime()-d.getTimezoneOffset()*60000);return o.toISOString().slice(0,10)};
const getTx=()=>db.transactions.filter(t=>t.account===db.account).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
function bounds(){const today=localDay();if(displayMode==='dia')return {from:today,to:today,label:'hoy'};if(displayMode==='rango')return {from:customFrom,to:customTo,label:'del '+customFrom+' al '+customTo};return {from:today.slice(0,7)+'-01',to:today,label:'este mes'}}
function filterPeriod(t){const b=bounds();return t.date>=b.from&&t.date<=b.to}
function balanceBefore(all,date){return totals(all.filter(t=>t.date<date)).income-totals(all.filter(t=>t.date<date)).expense}
function balanceAt(all,date){const t=totals(all.filter(x=>x.date<=date));return t.income-t.expense}
function modeSelect(m){displayMode=m;db.displayMode=m;save();render()}
function openApp(m){if(!['dia','mes'].includes(m))return;modeSelect(m)}
function setRangePart(which,value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return;if(which==='from')customFrom=value;else customTo=value;if(customFrom>customTo){notify('La fecha inicial no puede ser posterior a la final',true);return}displayMode='rango';db.displayMode='rango';save();render()}
function modePanel(){const b=bounds();return `<section class="modebox"><div class="line"><h2>🗓️ ¿Qué período quieres ver?</h2><span class="tiny">Puedes cambiarlo cuando quieras</span></div><div class="modegrid"><button class="${displayMode==='dia'?'on':''}" onclick="modeSelect('dia')">☀️ Diario</button><button class="${displayMode==='mes'?'on':''}" onclick="modeSelect('mes')">📆 Mensual</button><button class="${displayMode==='rango'?'on':''}" onclick="modeSelect('rango')">📅 Fechas</button></div>${displayMode==='rango'?`<div class="daterange"><label><span class="fieldlabel">Desde</span><input class="field" type="date" value="${customFrom}" max="${customTo}" onchange="setRangePart('from',this.value)"></label><label><span class="fieldlabel">Hasta</span><input class="field" type="date" value="${customTo}" min="${customFrom}" onchange="setRangePart('to',this.value)"></label></div>`:''}<p class="periodinfo">${displayMode==='dia'?'Cada día, los indicadores de ingresos y gastos empiezan en cero; el saldo disponible se conserva.':displayMode==='mes'?'Los indicadores vuelven a cero al empezar cada mes. El saldo disponible se conserva.':'Consulta ingresos, gastos y saldo de cualquier intervalo.'} Tus registros antiguos nunca se eliminan automáticamente.</p></section>`}
function welcomePanel(){return `<div class="welcome"><div class="welcomepanel"><div class="logoicon">💸</div><h1>¡Bienvenido a Mi Bolsillo!</h1><p class="sub">Antes de empezar, elige cómo quieres ver tus gastos. Esta preferencia se puede cambiar después, sin perder tus datos.</p><div class="welcomechoices"><button onclick="openApp('dia')"><b>☀️ Quiero ver mis gastos diarios</b><span>Hoy empieza en cero. Mañana los gastos de hoy pasan al historial y el saldo final continúa.</span></button><button onclick="openApp('mes')"><b>📆 Quiero ver mis gastos mensuales</b><span>El resumen se reinicia cada mes. Los ahorros, el saldo y el historial siguen intactos.</span></button></div><p class="minihelp">También tendrás un selector de fechas para consultar cualquier período. Personal y Negocio mantienen sus saldos independientes.</p></div></div>`}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));syncNative()}catch(e){notify('No se pudo guardar en este navegador',true)}}
function notify(msg,err=false){const e=$('toast');e.innerHTML=`<div class="toast" style="${err?'background:#ffd1d9;color:#481527':''}">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.innerHTML='',3200)}
const totals=tx=>({income:tx.filter(t=>t.type==='ingreso').reduce((s,t)=>s+t.amount,0),expense:tx.filter(t=>t.type==='gasto').reduce((s,t)=>s+t.amount,0)});
function streak(){const days=[...new Set(db.transactions.map(t=>t.date))].sort().reverse();let run=0;const d=new Date(localDay()+'T12:00:00');if(!days.includes(localDay()))d.setDate(d.getDate()-1);while(days.includes(localDay(d))){run++;d.setDate(d.getDate()-1)}return run}
function level(){const x=db.transactions.length;return {points:x*10,level:Math.floor(x/10)+1,progress:(x%10)*10}}
function catTotals(tx){return Object.entries(tx.filter(t=>t.type==='gasto').reduce((a,t)=>(a[t.category]=(a[t.category]||0)+t.amount,a),{})).sort((a,b)=>b[1]-a[1])}
function render(){if(!displayMode){$('app').innerHTML=welcomePanel();return}
const all=getTx(),filtered=all.filter(filterPeriod),sum=totals(filtered),b=bounds(),opening=balanceBefore(all,b.from),balance=balanceAt(all,b.to),spent=catTotals(filtered),lvl=level();
$('app').innerHTML=`<div class="wrap">
 <div class="top"><div class="logo"><div class="logoicon">💸</div><div><strong>Mi Bolsillo</strong><div class="tiny">¿Dónde se fue mi plata?</div></div></div><button class="pill" onclick="go('ajustes')">⚙️ Ajustes</button></div>
 <div class="switches"><button class="${db.account==='personal'?'on':''}" onclick="account('personal')">👤 Personal</button><button class="${db.account==='negocio'?'on':''}" onclick="account('negocio')">🏪 Negocio</button></div>
 ${modePanel()}
 <section class="hero"><div class="herogrid"><div><p>Saldo al cierre ${displayMode==='dia'?'de hoy':displayMode==='mes'?'del período':'del rango'} · ${db.account==='personal'?'Cuenta personal':'Cuenta negocio'}</p><div class="balance ${balance<0?'negative':''}">${money(balance)}</div><div class="summary"><div><span>↙ Ingresos ${esc(b.label)}</span><b class="positive">${money(sum.income)}</b></div><div><span>↗ Gastos ${esc(b.label)}</span><b class="negative">${money(sum.expense)}</b></div></div><p style="margin-top:17px">💼 Saldo inicial del período: <b>${money(opening)}</b> · Saldo final: <b>${money(balance)}</b></p></div><div class="motivation"><strong>✨ Nivel ${lvl.level} · ${lvl.points} puntos</strong><p>🔥 ${streak()} días seguidos registrando<br>Tu constancia cuenta. Cada registro suma 10 puntos.</p><div class="progress"><div style="width:${lvl.progress}%"></div></div><p>${10-db.transactions.length%10} movimientos para subir de nivel</p></div></div></section>
 <nav class="nav">${[['inicio','🏠 Inicio'],['registrar','➕ Registrar'],['historial','📒 Movimientos'],['analisis','📊 Análisis'],['descubre','🧠 Descubre'],['informes','🖨️ Informes'],['retos','🏆 Retos'],['ajustes','⚙️ Ajustes']].map(([id,l])=>`<button class="${tab===id?'on':''}" onclick="go('${id}')">${l}</button>`).join('')}</nav>
 <main>${({inicio:()=>home(all,filtered,sum,spent),registrar:()=>form(),historial:()=>history(all),analisis:()=>analysis(all,filtered,sum,spent),descubre:()=>insights(all,filtered,sum),informes:()=>reports(all,filtered,sum),retos:()=>rewards(all,filtered,sum),ajustes:()=>settings()})[tab]()}</main></div>
 <div class="bottom">${[['inicio','🏠','Inicio'],['registrar','➕','Registrar'],['historial','📒','Historial'],['analisis','📊','Análisis'],['retos','🏆','Retos']].map(([id,icon,label])=>`<button class="${tab===id?'on':''} ${id==='registrar'?'add':''}" onclick="go('${id}')"><span>${icon}</span>${label}</button>`).join('')}</div>`;
}
function periodPicker(){return `<span class="tiny">${esc(bounds().label)}</span>`}

function rewards(all,filtered,sum){const saved=all.filter(t=>t.type==='gasto'&&t.category==='Ahorro').reduce((s,t)=>s+t.amount,0);const goal=db.goals[db.account],ratio=goal.target?saved/goal.target*100:0;const count=db.transactions.length;const awards=[['🌱','Primer paso',count>=1,'Registra tu primer movimiento'],['🧭','Explorador',count>=5,'Registra 5 movimientos'],['⭐','Constante',count>=20,'Registra 20 movimientos'],['🔥','Racha de fuego',streak()>=3,'Registra durante 3 días seguidos'],['🐷','Ahorrador',saved>0,'Registra un aporte al ahorro'],['🏆','Meta cumplida',saved>=goal.target&&goal.target>0,'Alcanza tu meta']];return `<div class="grid"><div><section class="card"><h2>🎯 Meta: ${esc(goal.name)}</h2><div class="line"><strong>${money(saved)}</strong><strong>${money(goal.target)}</strong></div><div class="progress" style="margin:14px 0"><div style="width:${Math.min(100,ratio)}%"></div></div><div class="sub">${Math.round(ratio)}% completado · ${ratio>=100?'¡Meta alcanzada! 🎉':'Faltan '+money(Math.max(0,goal.target-saved))}</div><div class="help" style="margin-top:13px">Registra un gasto en la categoría «Ahorro» para reservar dinero para esta meta. Así, el saldo disponible baja y la meta avanza.</div><button class="btn positive" style="margin-top:13px" onclick="prefillSaving()">🐷 Aportar al ahorro</button></section><section class="card"><h2>🎮 Tu nivel financiero</h2><div class="twocol"><div class="kpi"><span>Puntos</span><b>${level().points} ✨</b></div><div class="kpi"><span>Racha</span><b>${streak()} 🔥</b></div></div><p class="sub">Suma 10 puntos por cada registro. Tus niveles aumentan cada 10 movimientos.</p><div class="progress"><div style="width:${level().progress}%"></div></div></section></div><section class="card"><h2>🏅 Insignias desbloqueables</h2>${awards.map(([em,n,yes,d])=>`<div class="rowitem"><div class="ico">${yes?em:'🔒'}</div><div class="itemmain"><b>${esc(n)}</b><span>${esc(d)}</span></div><span class="badge ${yes?'unlocked':''}">${yes?'Lograda':'Pendien function insights(all,filtered,sum){
 const today=localDay(),month=today.slice(0,7),day=Number(today.slice(-2)),daysInMonth=new Date(Number(today.slice(0,4)),Number(today.slice(5,7)),0).getDate();

function printReport(){if(window.AndroidBridge?.printHtml){window.AndroidBridge.printHtml(reportHtml());return}const w=window.open('','_blank');if(w){w.document.write(reportHtml());w.document.close();w.print()}else notify('Para imprimir usa la versión Android',true)}
function exportReportCSV(){const r=reportData(),head=['Fecha','Cuenta','Tipo','Categoría','Descripción','Importe','Moneda'];const rows=[head,...r.tx.map(t=>[t.date,t.account,t.type,t.category,t.note,t.amount,db.currency[t.account]])];download('informe-'+db.account+'-'+r.b.from+'-'+r.b.to+'.csv','\ufeff'+rows.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}
window.openQuickEntry=function(){if(!displayMode){displayMode='dia';db.displayMode='dia';save()}entryType='gasto';editing=null;tab='registrar';render();setTimeout(()=>$('amount')?.focus(),150)};
function go(x){tab=x;editing=null;render();window.scrollTo({top:0,behavior:'smooth'})}
function account(x){db.account=x;save();editing=null;tab='inicio';render()}
function changeType(x){entryType=x;editing=null;render()}
function commit(o){db.transactions.push({id:Date.now()+Math.floor(Math.random()*1000000),account:db.account,type:o.type,amount:Number(o.amount),category:o.category,date:o.date||localDay(),note:o.note||o.category});save();render();notify((o.type==='gasto'?'Gasto':'Ingreso')+' registrado. ¡+10 puntos! ✨')}
function quickAdd(cat,amount,note){commit({type:cat==='Ventas'?'ingreso':'gasto',amount,category:cat,note})}
function parseSmart(text){let clean=text.trim();let number=clean.match(/(?:bs\.?\s*)?(\d+(?:[.,]\d{1,2})?)(?:\s*(?:bs|bolivianos?))?/i);if(!number)return null;let amount=Number(number[1].replace(',','.'));if(!Number.isFinite(amount)||amount<=0)return null;let inc=/\b(gan[eé]|cobr[eé]|recib[ií]|ingres[oó]|vend[ií]|venta|sueldo|pagaron|depositaron|me pagaron)\b/i.test(clean);let type=inc?'ingreso':'gasto';let w=clean.toLowerCase();let cat;
if(type==='ingreso'){cat=db.account==='negocio'?'Ventas':'Trabajo extra';if(/sueldo|salario/.test(w))cat=db.account==='personal'?'Sueldo':'Capital';else if(/regalo/.test(w))cat=db.account==='personal'?'Regalos':'Otros';else if(/cobr/.test(w))cat=db.account==='negocio'?'Cobros':'Trabajo extra';else if(/capital/.test(w)&&db.account==='negocio')cat='Capital';else if(/venta|vend/.test(w))cat='Ventas'}
else{cat='Otros';const rules=[[/ahorr|guard[eé]|reserv[eé]/,'Ahorro'],[/almuerzo|desayuno|cena|comida|café|cafe|pan|pollo|restaurante|hamburguesa|mercado de comida/,'Alimentación'],[/gasolina|di[eé]sel|combustible|nafta/,'Gasolina'],[/taxi|micro|trufi|bus|pasaje|transporte|uber/,'Transporte'],[/mercader[ií]a|inventario|stock|producto para vender/,'Mercadería'],[/alquiler|renta/,'Alquiler'],[/luz|agua|internet|tel[eé]fono|electricidad/,'Servicios'],[/medicina|farmacia|doctor|salud/,'Salud'],[/curso|universidad|libro|educaci[oó]n/,'Educación'],[/cine|juego|fiesta|entretenimiento/,'Entretenimiento'],[/ropa|zapato|compras|regalo/,'Compras'],[/publicidad|anuncio|facebook ads/,'Publicidad'],[/salario|empleado|ayudante/,'Sueldos']];for(const [rx,c] of rules){if(rx.test(w)&&categories[db.account].gasto.includes(c)){cat=c;break}}}
if(cat==='Gasolina'&&db.account==='personal')cat='Transporte';if(!categories[db.account][type].includes(cat))cat='Otros';return {amount,type,category:cat,note:clean,date:localDay()}}
function smartAdd(e){e.preventDefault();let value=$('smart').value;let x=parseSmart(value);if(!x)return notify('Incluye un monto. Ejemplo: Gasté 35 en transporte',true);commit(x)}
window.receiveAndroidDictation=function(value){go('inicio');setTimeout(()=>{const el=$('smart');if(el){el.value=value;el.focus();notify('Texto reconocido: revisa y pulsa Agregar')}},50)};
function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR&&window.AndroidBridge?.startDictation){window.AndroidBridge.startDictation();return}if(!SR){notify('Este navegador no permite dictado. Usa el teclado de voz de tu celular.',true);$('smart')?.focus();return}try{voice=new SR();voice.lang='es-BO';voice.interimResults=false;voice.onresult=e=>{let result=e.results[0][0].transcript;const input=$('smart');if(input){input.value=result;notify('Texto reconocido. Revisa y pulsa Agregar.')}};voice.onerror=()=>notify('No se pudo usar el micrófono. Revisa permisos.',true);voice.start();notify('🎙️ Escuchando...')}catch(e){notify('Micrófono no disponible',true)}}
function submitTx(e){e.preventDefault();const amount=Number($('amount').value),cat=$('category').value,date=$('date').value,note=$('note').value.trim();if(!(amount>0&&amount<=999999999)||!/^\d{4}-\d{2}-\d{2}$/.test(date))return notify('Revisa el monto y la fecha',true);if(editing){let t=db.transactions.find(x=>x.id===editing);if(!t)return;t.amount=amount;t.category=cat;t.date=date;t.note=note||cat;t.type=entryType;editing=null;save();go('historial');notify('Movimiento actualizado')}else commit({type:entryType,amount,category:cat,date,note})}
function editTx(id){let t=db.transactions.find(x=>x.id===id);if(!t)return;entryType=t.type;editing=id;tab='registrar';render()}
function deleteTx(id){if(!confirm('¿Eliminar este movimiento?'))return;db.transactions=db.transactions.filter(t=>t.id!==id);save();render();notify('Movimiento eliminado')}
function prefillSaving(){entryType='gasto';editing=null;tab='registrar';render();$('category').value='Ahorro';$('note').value='Aporte a mi meta';$('amount').focus()}
function saveSettings(e){e.preventDefault();db.budgets[db.account]=Math.max(0,Number($('budget').value));db.goals[db.account]={name:$('goalName').value.trim(),target:Math.max(1,Number($('goalTarget').value))};save();render();notify('Configuración guardada')}
function download(name,content,type){if(window.AndroidBridge?.saveText){window.AndroidBridge.saveText(name,content,type);return}const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download('mi-bolsillo-respaldo-'+localDay()+'.json',JSON.stringify(db,null,2),'application/json');notify('Respaldo descargado')}
function exportCSV(){const rows=[['Cuenta','Tipo','Fecha','Categoría','Descripción','Monto','Moneda'],...db.transactions.map(t=>[t.account,t.type,t.date,t.category,t.note,String(t.amount),db.currency[t.account]||'BOB'])];const csv='\ufeff'+rows.map(row=>row.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download('mi-bolsillo-movimientos-'+localDay()+'.csv',csv,'text/csv;charset=utf-8');notify('CSV descargado')}
async function importJSON(e){const file=e.target.files[0];if(!file)return;try{const j=JSON.parse(await file.text());if(!j||!Array.isArray(j.transactions)||!j.budgets||!j.goals||!j.goals.personal||!j.goals.negocio||!j.budgets.personal&&j.budgets.personal!==0||j.transactions.some(t=>!['personal','negocio'].includes(t.account)||!['ingreso','gasto'].includes(t.type)||!Number.isFinite(t.amount)||t.amount<=0||!/^\d{4}-\d\d-\d\d$/.test(t.date)))throw Error('Estructura inválida');if(!confirm('Esto reemplazará todos tus movimientos actuales. ¿Continuar?'))return;db=j;db.currency=db.currency||{personal:'BOB',negocio:'BOB'};db.quickNotification=!!db.quickNotification;displayMode=['dia','mes','rango'].includes(db.displayMode)?db.displayMode:'mes';db.account=['personal','negocio'].includes(db.account)?db.account:'personal';save();go('inicio');notify('Respaldo importado')}catch(err){notify('Archivo inválido o dañado',true)}}
function clearAll(){if(!confirm('¿Eliminar todos los datos de ambas cuentas? Esta acción no se puede deshacer.'))return;db=blank();db.displayMode=displayMode||'dia';save();go('inicio');notify('Datos borrados')}
function demo(){if(db.transactions.length&&!confirm('Se agregarán registros de ejemplo a tus datos. ¿Continuar?'))return;const today=localDay();const demos=[['personal','ingreso',2600,'Sueldo','Sueldo del mes'],['personal','gasto',55,'Alimentación','Almuerzo familiar'],['personal','gasto',35,'Transporte','Taxi'],['personal','gasto',150,'Ahorro','Mi ahorro semanal'],['negocio','ingreso',1200,'Ventas','Ventas del día'],['negocio','gasto',350,'Mercadería','Reposición de productos'],['negocio','gasto',80,'Gasolina','Combustible']];for(const [account,type,amount,category,note] of demos){db.transactions.push({id:Date.now()+Math.floor(Math.random()*100000000),account,type,amount,category,note,date:today})}save();render();notify('Agregados 7 movimientos de demostración')}
render();syncNative();
// Refresh the active daily/monthly view when returning to the app on a new date.
let lastViewedDay=localDay();
function refreshOnNewDay(){const now=localDay();if(now!==lastViewedDay){lastViewedDay=now;render()}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshOnNewDay()});
window.addEventListener('focus',refreshOnNewDay);
</script></body></html>
